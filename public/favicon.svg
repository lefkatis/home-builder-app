<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="hpbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4F46E5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background circle/rounded rect -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#090D16" stroke="url(#hpbGradient)" stroke-width="2.5" />

  <!-- House Silhouette with Smart Circuits -->
  <g filter="url(#shadow)">
    <!-- Roof -->
    <path d="M14 30 L32 14 L50 30" fill="none" stroke="url(#hpbGradient)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- House Body -->
    <path d="M19 28 L19 48 C19 50 20 51 22 51 L42 51 C44 51 45 50 45 48 L45 28" fill="none" stroke="url(#hpbGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Smart Provisions Circuit Lines -->
    <!-- Central Lightning / Electricity Bolt -->
    <path d="M33 22 L27 34 L33 34 L31 44 L39 31 L33 31 Z" fill="url(#glowGradient)" />

    <!-- Circuit Connection Nodes (Provisions) -->
    <circle cx="21" cy="38" r="2.5" fill="#06B6D4" />
    <circle cx="43" cy="38" r="2.5" fill="#818CF8" />
    <line x1="21" y1="38" x2="27" y2="38" stroke="#06B6D4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 2"/>
    <line x1="39" y1="38" x2="43" y2="38" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 2"/>

    <!-- Small chimney / antenna -->
    <path d="M41 18 L41 22" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="41" cy="16" r="1.5" fill="#22D3EE" />
  </g>
</svg>
